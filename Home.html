<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceLike</title>
    <style>
        /* --- Base Reset & Layout --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #000; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            overflow: hidden; 
        }

        /* --- Logo & Emoji Styling --- */
        .logo-container {
            z-index: 10;
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-emoji {
            font-size: 5rem;
            display: block;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
        }

        .logo-text {
            color: #ffffff;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8), 0 0 15px rgba(255, 255, 255, 0.4);
        }

        /* --- Navigation Bar --- */
        .floating-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 85%;
            max-width: 950px;
            height: 90px;
            padding: 0 30px;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            color: white;
            text-decoration: none; /* Removes the default link underline */
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .nav-item:hover { transform: translateY(-8px); }

        .nav-emoji { font-size: 1.8rem; margin-bottom: 5px; }

        .nav-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }

        /* --- Snow Effect --- */
        .snow {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <span class="logo-emoji">🚀</span>
        <div class="logo-text">Welcome To SpaceLike</div>
    </div>

    <nav class="floating-bar">
        <!-- Add your URLs inside the href="" quotes below -->
        <a href="https://your-games-link.com" class="nav-item">
            <span class="nav-emoji">🎮</span>
            <span class="nav-label">GAMES</span>
        </a>
        <a href="https://your-apps-link.com" class="nav-item">
            <span class="nav-emoji">📱</span>
            <span class="nav-label">APPS</span>
        </a>
        <a href="https://your-browse-link.com" class="nav-item">
            <span class="nav-emoji">🌐</span>
            <span class="nav-label">Browse</span>
        </a>
        <a href="https://your-settings-link.com" class="nav-item">
            <span class="nav-emoji">⚙️</span>
            <span class="nav-label">Settings</span>
        </a>
    </nav>

    <canvas id="snowCanvas" class="snow"></canvas>

    <script>
        const canvas = document.getElementById('snowCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles;

        function init() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            particles = [];
            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: Math.random() * 3 + 1,
                    d: Math.random() * 1
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                ctx.moveTo(p.x, p.y);
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2, true);
            }
            ctx.fill();
            update();
        }

        function update() {
            for (let i = 0; i < particles.length; i++) {
                let p = particles[i];
                p.y += Math.cos(p.d) + 1 + p.r / 2;
                if (p.y > height) {
                    particles[i] = { x: Math.random() * width, y: -10, r: p.r, d: p.d };
                }
            }
        }

        window.addEventListener('resize', init);
        init();
        setInterval(draw, 33);
    </script>
</body>
</html>
